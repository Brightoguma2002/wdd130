<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitewater Rafting Adventures | Contact Us</title>
    <meta name="description" content="Contact White Water Rafting for inquiries, reservations, and more information.">
    <meta name="author" content="Osarodion Bright Oguma">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/whitewaterrafting.png" alt="Whitewater Rafting Organizations logo" class="logo">
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Company Info - Centered -->
        <div class="contact-info">
            <h1>Whitewater Rafting Adventures</h1>
            <p>101 Adventure Trail Rd</p>
            <p>Nesquehoning, PA 18240, USA</p>
            <p><a href="tel:+15706699127">(570) 669-9127</a></p>
            <p><a href="mailto:info@adventurerafting.com">info@adventurerafting.com</a></p>
        </div>

        <!-- Map (left) + Form (right) -->
        <div class="contact-wrap">
            <!-- Map on the left -->
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3017.1057275144058!2d-75.79685289999999!3d40.8695539!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c5b2053f4c26ab%3A0x59bebc6dc172141b!2sWhitewater%20Rafting%20Adventures!5e0!3m2!1sen!2sng!4v1790757932680!5m2!1sen!2sng" 
                    style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <!-- Form on the right -->
            <section class="contact-form">
                <form action="#" method="post">
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required autocomplete="name">
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="" required autocomplete="email">
                    </div>

                    <fieldset>
                        <legend>Message Purpose</legend>
                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <div class="form-row stacked">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" placeholder="Type here" required></textarea>
                    </div>

                    <div class="checkbox-option">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </section>
        </div>

        <!-- Team Section -->
        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">
                <figure>
                    <img src="images/employee4.webp" alt="Portrait of Sam Rivera" width="200" height="200" loading="lazy">
                    <figcaption>Sam Rivera<br>Owner and Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of Dana Kim" width="200" height="200" loading="lazy">
                    <figcaption>Dana Kim<br>Reservation Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.webp" alt="Portrait of Alex Morgan" width="200" height="200" loading="lazy">
                    <figcaption>Alex Morgan<br>Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Whitewater Rafting Adventures | Osarodion Bright Oguma</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
