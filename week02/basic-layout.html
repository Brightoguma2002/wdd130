<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Osarodion Briht Oguma">
</head>
<body>
    <header>
        <img src="salt-lake-temple.jpg" alt="salt lake temple" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://byui.edu">BYU.Idaho</a></li>
            <li><a href="https://churchofjesuschrist.org">The Church</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequuntur, quia!</p>
        </section>
    </main>
    <aside>
        <img src="salt-lake-temple.jpg" width="200">
    </aside>
    <footer>
        <p>🌴 Osarodion Bright Oguma</p>
    </footer>
    
</body>
</html>
